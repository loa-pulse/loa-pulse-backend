services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: loapulse
      POSTGRES_USER: loapulse
      POSTGRES_PASSWORD: loapulse
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8
    ports:
      - "16379:6379"

volumes:
  postgres-data:
